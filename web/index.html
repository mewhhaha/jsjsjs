<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>js3 · Model</title>
    <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #202522;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #animation {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      max-width: calc(100% - 64px);
      border: 1px solid #ffffff30;
      border-radius: 10px;
      background: #18221fed;
      color: #edf4ef;
      font: 13px system-ui, sans-serif;
      box-shadow: 0 5px 25px #0005;
    }
    #animation[hidden] {
      display: none;
    }
    #animation button,
    #animation select {
      background: #32443b;
      color: inherit;
      border: 1px solid #ffffff30;
      border-radius: 5px;
      padding: 6px 8px;
    }
    #animation-time {
      width: clamp(80px, 24vw, 360px);
      accent-color: #b4d9b5;
    }
    #animation-position {
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    #animation label {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    @media (max-width: 700px) {
      #animation {
        flex-wrap: wrap;
        width: calc(100% - 64px);
        justify-content: center;
      }
      #animation-time {
        flex: 1;
      }
    }
    </style>
    <script type="importmap">
    { "imports": { "three": "/three.js", "manifold-3d": "/_js3/manifold.js" } }
    </script>
  </head>
  <body>
    <canvas aria-label="Interactive 3D model"></canvas>
    <div id="animation" role="group" aria-label="Animation controls" hidden>
      <select id="animation-clip" aria-label="Animation clip"></select>
      <button id="animation-play" type="button">Play</button>
      <input id="animation-time" type="range" min="0" max="1" step="0.001"
        value="0" aria-label="Animation time" />
      <output id="animation-position"
        for="animation-time">0.00 / 0.00 s</output>
      <select id="animation-speed" aria-label="Playback speed">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
      </select>
      <label><input id="animation-loop" type="checkbox" checked /> Loop</label>
    </div>
    <script type="module" src="/viewer.js"></script>
  </body>
</html>
